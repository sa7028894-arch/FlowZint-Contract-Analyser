<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowZint Dashboard</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --accent-glow: #8b5cf6; --text-main: #f8fafc; }
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color)); font-family: 'Inter', sans-serif; }
        .card { background: var(--card-bg); padding: 48px; border-radius: 24px; backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; width: 320px; border: 1px solid rgba(255, 255, 255, 0.1); }
        h2 { color: var(--text-main); margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 0.9em; margin-bottom: 30px; }
        input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid #334155; border-radius: 12px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--accent-glow); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:disabled { background: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Dashboard</h2>
        <p>Enter your credentials to continue</p>
        <form id="loginForm">
            <input id="user" placeholder="Username" required>
            <input id="pass" type="password" placeholder="Password" required>
            <button type="submit" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerText = 'Authenticating...';

            let res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            let result = await res.json();
            
            if(result.status === 'success') {
                alert('Welcome!');
                // Logic to show upload form after successful login
                window.location.href = '/'; 
            } else {
                alert('Login failed');
                btn.disabled = false;
                btn.innerText = 'Login';
            }
        };
    </script>
</body>
</html>
